[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
lib_ldf_mode = deep
lib_deps = Eyetracker_inferencing
		   me-no-dev/AsyncTCP@^3.3.2
		   fastled/FastLED@^3.9.14
		   https://github.com/me-no-dev/ESPAsyncWebServer.git